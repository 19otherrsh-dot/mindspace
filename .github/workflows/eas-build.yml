name: EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (e.g., development, preview, production)'
        required: true
        default: 'preview'
      platform:
        description: 'Platform (all, ios, android)'
        required: true
        default: 'all'

jobs:
  build:
    name: Build via EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run EAS Build
        run: cd apps/mobile && eas build --profile ${{ github.event.inputs.profile }} --platform ${{ github.event.inputs.platform }} --non-interactive

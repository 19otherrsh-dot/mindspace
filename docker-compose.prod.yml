version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: mindspace-api:latest
    container_name: mindspace_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://mindspace:mindspace_prod_pass@db:5432/mindspace
      - REDIS_URL=redis://redis:6379
      # Security secrets - you MUST inject these via .env in production
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - MOOD_ENCRYPTION_KEY=${MOOD_ENCRYPTION_KEY}
      - CDN_BASE_URL=${CDN_BASE_URL:-http://localhost:4000/public}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16-alpine
    container_name: mindspace_db
    restart: always
    environment:
      - POSTGRES_USER=mindspace
      - POSTGRES_PASSWORD=mindspace_prod_pass
      - POSTGRES_DB=mindspace
    volumes:
      - mindspace_prod_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindspace -d mindspace"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mindspace_redis
    restart: always
    volumes:
      - mindspace_prod_redis_data:/data
    ports:
      - "6379:6379"

volumes:
  mindspace_prod_db_data:
  mindspace_prod_redis_data:

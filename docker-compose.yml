services:
  postgres:
    image: postgres:16-alpine
    container_name: mindspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mindspace
      POSTGRES_PASSWORD: mindspace
      POSTGRES_DB: mindspace
    ports:
      - "5433:5432"
    volumes:
      - mindspace-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindspace -d mindspace"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mindspace-redis
    restart: unless-stopped
    ports:
      # 6379 and 6380 are commonly taken by other local stacks.
      - "6381:6379"
    volumes:
      - mindspace-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mindspace-pgdata:
  mindspace-redisdata:
